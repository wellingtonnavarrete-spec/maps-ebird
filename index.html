<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Mapa interactivo de aves de Chile con hotspots de eBird, navegación y avisos de aves raras.">
  <title>Mapa de Aves</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="map"></div>

  <!-- Barra superior: buscador + menú -->
  <div class="barra-superior">
    <div class="buscador">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="buscar" type="search" placeholder="Buscar hotspot…" autocomplete="off" aria-label="Buscar hotspot" aria-controls="resultados">
      <div id="resultados" class="resultados" role="listbox" hidden></div>
    </div>
    <button class="btn-circular" data-accion="menu" title="Ajustes" aria-label="Abrir ajustes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>

  <!-- Acciones inferiores -->
  <div class="acciones-inferiores">
    <div class="region-chip" title="Región de los datos"><span id="region-actual">La Araucanía</span></div>
    <div class="pildoras">
      <button class="pildora pildora-roja" data-accion="activos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 1.5S11 5 11 7.5c0 1.4.6 2.6 1.5 3.5-1-.7-2-1.8-2-3.5 0 0-3.5 3.5-3.5 7.5a7 7 0 0 0 14 0c0-5.5-4.5-9.5-7.5-13.5z"/></svg>
        Activos 7 días
      </button>
      <button class="pildora pildora-ambar" data-accion="raras">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.6-6.2 3.6 1.4-7L2 9.3l7-.8z"/></svg>
        Aves raras
      </button>
    </div>
  </div>

  <!-- Selector de capas -->
  <div class="map-style-container" role="group" aria-label="Tipo de mapa">
    <button class="map-style-btn" data-accion="estilo" data-estilo="calles">
      <span class="style-icon-box icon-streets"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4z"/><path d="M8 2v16M16 6v16"/></svg></span>
      <span>Calles</span>
    </button>
    <button class="map-style-btn" data-accion="estilo" data-estilo="satelite">
      <span class="style-icon-box icon-satellite"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></span>
      <span>Satélite</span>
    </button>
    <button class="map-style-btn" data-accion="estilo" data-estilo="relieve">
      <span class="style-icon-box icon-relief"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m2 20 7-12 4 6 3-4 6 10z"/></svg></span>
      <span>Relieve</span>
    </button>
  </div>

  <!-- Botón para volver a centrar (aparece al mover el mapa) -->
  <button id="btn-centrar" class="btn-ubicacion" data-accion="centrar" title="Centrar en mi ubicación" aria-label="Centrar en mi ubicación">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A9 9 0 0 0 13 3.06V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
  </button>

  <!-- Panel lateral -->
  <aside id="side-panel" aria-hidden="true">
    <div class="panel-cabecera">
      <h2 id="panel-titulo">Observaciones</h2>
      <button class="btn-icono" data-accion="cerrar-panel" aria-label="Cerrar panel">×</button>
    </div>
    <div id="panel-content"></div>
  </aside>

  <!-- HUD de navegación -->
  <div id="nav-hud">
    <div id="nav-top-banner">
      <div class="nav-arrow-icon">
        <svg id="nav-flecha" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
      <div class="nav-textos">
        <div id="nav-instruccion">En ruta</div>
        <div id="nav-sub">Sigue el trazado de la ruta</div>
      </div>
    </div>
    <div id="nav-bottom-bar">
      <div class="hud-metrics">
        <div class="speedometer-box"><span id="speedometer-value">0</span><small>km/h</small></div>
        <div>
          <div id="nav-tiempo">Calculando…</div>
          <div id="nav-detalle">Conectando con GPS</div>
          <div id="nav-combustible"></div>
        </div>
      </div>
      <div class="hud-botones">
        <button id="btn-quitar-parada" class="btn-hud" data-accion="quitar-parada" hidden>Quitar parada</button>
        <button id="nav-exit-btn" data-accion="salir">Salir</button>
      </div>
    </div>
  </div>

  <!-- Alerta de hotspot cercano en ruta -->
  <div id="desvio-card" class="desvio-card-hud" role="status" aria-live="polite"></div>

  <!-- Avisos -->
  <div id="toasts" aria-live="polite"></div>

  <!-- Scripts: primero Mapbox GL, luego configuración, luego la app -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="config.js?v=3"></script>
  <script>
    // config.local.js (con tu key de pruebas) solo se carga en tu computador
    if (['localhost', '127.0.0.1'].includes(location.hostname)) document.write('<script src="config.local.js"><\/script>');
  </script>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
