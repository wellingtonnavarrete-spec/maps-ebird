<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador eBird</title>
    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Mapbox Directions Plugin CSS y JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.css" type="text/css">
</head>
<body>
    <div id="map"></div>
<!-- Barra de búsqueda y centrado de ubicación -->
<div class="top-controls" style="position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 8px;">
    <input type="text" placeholder="🔍 Buscar hotspot..." oninput="buscarHotspotPorNombre(this.value)" style="padding: 8px 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">
    <button onclick="centrarUbicacion()" style="padding: 8px 14px; border-radius: 20px; border: none; background: #ffffff; cursor: pointer; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">🎯 Mi Ubicación</button>
</div>
    <!-- NUEVO: Botón de Radar de Actividad -->
    <button id="btn-radar" onclick="buscarHotspotsActivos()">
        🔥 Ver activos (Últimos 7 días)
    </button>

    <!-- NUEVO: Panel lateral oculto -->
    <div id="side-panel" class="panel-hidden">
        <button id="close-panel" onclick="cerrarPanel()">×</button>
        <h2>Observaciones Recientes</h2>
        <div id="panel-content">
            <p>Selecciona un punto en el mapa...</p>
        </div>
    </div>
<!-- HUD de Navegación en Ruta Limpio -->
    <div id="nav-hud" style="display: none;">
        <div id="nav-top-banner">
            <div class="nav-arrow-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </div>
            <div>
                <div id="nav-instruction" style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">En ruta</div>
                <div id="nav-sub-instruction" style="font-size: 13px; opacity: 0.85;">Sigue el trazado de la ruta</div>
            </div>
        </div>
        
       <div id="nav-bottom-bar">
    <div class="hud-metrics" style="display: flex; align-items: center; gap: 15px;">
        <div id="speedometer" class="speedometer-box">
            <span id="speedometer-value">0</span>
            <small>km/h</small>
        </div>
        <div>
            <div id="nav-time" style="font-size: 22px; font-weight: 800; color: #34d399; line-height: 1.2;">Calculando...</div>
            <div id="nav-details" style="font-size: 13px; color: #9ca3af; margin-top: 2px;">Conectando con GPS</div>
            <div id="fuel-estimate" class="hud-fuel" style="font-size: 11px; color: #fde047; margin-top: 2px;">Est. Combustible: --</div>
        </div>
    </div>
    <button id="nav-exit-btn" onclick="salirNavegacion()">Salir</button>
</div>
    <!-- Botón Flotante para Centrar Ubicación (Oculto por defecto) -->
<button id="btn-centrar" class="btn-floating-location" onclick="centrarUbicacion()" title="Centrar ubicación" style="display: none;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#1e293b">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
</button>
   <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
        
<!-- Botón de Menú Circular -->
    <button id="btn-menu-circular" class="btn-circle-menu" onclick="togglePanelLateral()" title="Menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
        
    <!-- Selector de Capas de Mapa (Esquina Inferior Izquierda) -->
    <div id="map-style-switcher" class="map-style-container">
        <button id="btn-style-streets" class="map-style-btn" onclick="cambiarEstiloMapa('streets')">
            <div class="style-icon-box icon-streets">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
            </div>
            <span>calles</span>
        </button>
        <button id="btn-style-satellite" class="map-style-btn active" onclick="cambiarEstiloMapa('satellite')">
            <div class="style-icon-box icon-satellite">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a14.5 14.5 0 0 0 0 29 14.5 14.5 0 0 0 0-29z"></path>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                </svg>
            </div>
            <span>Satélite</span>
        </button>
    </div>

    <!-- Tu código principal -->
    <script src="app.js?v=2"></script>
</body>
</html>
